<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yats — Yatin Sharma | Brand, web & social design." />
    <meta property="og:title" content="Yats — Yatin Sharma" />
    <meta property="og:description" content="Brand, web, and social made to feel like the same business. Yats — Yatin Sharma." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F8F6F1" />
    <link rel="icon" type="image/svg+xml" href="/yats-mark.svg" />
    <title>Yats — Yatin Sharma</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f1e8;
        transition: opacity 0.35s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader svg { width: 54px; height: 54px; overflow: visible; }
      #initial-loader path { fill: none; stroke: #f05b43; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }
      #initial-loader .mark-main { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw-y 0.75s cubic-bezier(.22,1,.36,1) forwards; }
      #initial-loader .mark-notch { stroke-dasharray: 10; stroke-dashoffset: 10; animation: draw-y 0.24s .45s ease-out forwards; stroke: #182338; stroke-width: 3; }
      @keyframes draw-y { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #initial-loader .mark-main, #initial-loader .mark-notch { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path class="mark-main" d="M7 8 24 26 41 8M24 26v15"/><path class="mark-notch" d="M33 16v7"/></svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
