<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yats — Yatin Sharma | Brand, web & social design." />
    <meta property="og:title" content="Yats — Yatin Sharma" />
    <meta property="og:description" content="Brand, web, and social made to feel like the same business. Yats — Yatin Sharma." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F8F6F1" />
    <link rel="icon" type="image/svg+xml" href="/yats-mark.svg" />
    <title>Yats — Yatin Sharma</title>

    <link rel="preload" href="/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/yats-logo.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/brusha-girl.webp" as="image" type="image/webp" fetchpriority="high" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(248 246 241 / 92%);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader svg { width: 48px; height: 48px; overflow: visible; }
      #initial-loader path { fill: none; stroke: #d24b3e; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      #initial-loader .mark-main { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw-y 0.58s cubic-bezier(.22,1,.36,1) forwards; }
      @keyframes draw-y { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #initial-loader .mark-main { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 36 36" aria-hidden="true"><path class="mark-main" d="M4.5 6.5 16.3 20 28.5 6.5M16.3 20 13 27.2C11.2 31.3 8.5 33.1 4.5 32.1"/></svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
